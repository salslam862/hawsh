<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السند</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial,Tahoma,sans-serif;background:#eef2f6;padding:20px;margin:0;color:#172033}.wrap{max-width:860px;margin:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 auto 16px;max-width:860px}.actions button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer}.primary{background:#0b63ce;color:#fff}.success{background:#168447;color:#fff}.secondary{background:#fff;border:1px solid #cbd3df!important}.actions button:disabled{opacity:.55;cursor:not-allowed}.sheet{background:#fff;padding:34px 38px;max-width:780px;margin:auto;box-shadow:0 4px 24px #0002;border:1px solid #d8dee8;box-sizing:border-box}.brand{text-align:center;border-bottom:3px solid #17365d;padding-bottom:16px;margin-bottom:18px}.brand img{max-height:62px;max-width:180px;object-fit:contain}.brand h2{margin:8px 0 3px;font-size:23px}.brand p{margin:3px 0;color:#667085}.doc-subtitle{font-weight:700;color:#475467;margin:2px 0 4px}.doc-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:16px 0 20px}.doc-title{font-size:25px;font-weight:800}.doc-no{font-weight:700;border:1px solid #cbd5e1;border-radius:8px;padding:9px 13px;background:#f8fafc}.box{border:1px solid #d7dee8;border-radius:10px;padding:15px;margin:12px 0}.box h3{margin:0 0 8px;font-size:17px}.row{display:flex;justify-content:space-between;gap:24px;padding:9px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}.row b{color:#344054}.footer{margin-top:24px;border-top:1px solid #d7dee8;padding-top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;font-size:13px;color:#667085;box-sizing:border-box;width:100%;overflow:hidden}.footer>div{min-width:0}.footer .stamp{flex:0 1 240px}.stamp{border:1px dashed #98a2b3;border-radius:8px;padding:10px 14px;text-align:center;min-width:0;max-width:240px;box-sizing:border-box;margin-right:0;position:static}.muted{color:#667085}.notice{max-width:780px;margin:40px auto;background:#fff;border:1px solid #ddd;padding:25px;border-radius:12px;text-align:center}@media(max-width:600px){body{padding:10px}.sheet{padding:22px 18px}.doc-head{flex-direction:column;align-items:stretch}.doc-title{font-size:21px}.footer{flex-direction:column}.footer .stamp{width:100%;max-width:none}.row{gap:12px;align-items:flex-start}.row span{text-align:left;word-break:break-word}}@media print{body{background:#fff;padding:0}.actions{display:none}.sheet{box-shadow:none;border:0;max-width:none}.doc-title{font-size:22px}}</style></head><body><div class="wrap"><div class="actions"><button class="primary" id="shareBtn" disabled>📱 مشاركة PDF</button><button class="success" id="waBtn" disabled>🟢 إرسال PDF عبر واتساب</button><button class="secondary" id="downloadBtn">⬇️ تنزيل PDF</button><button class="secondary" onclick="window.print()">🖨️ طباعة</button><button class="secondary" onclick="window.close()">إغلاق</button></div><div id="content"><div class="notice">جارٍ تحميل السند...</div></div></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const identityTypeName=v=>({NATIONAL_ID:'هوية وطنية / شخصية',RESIDENCY_ID:'هوية مقيم',PASSPORT:'جواز سفر',OTHER:'هوية أخرى'}[v]||v||'-');
const formatDateTime=(v,tz='Asia/Riyadh')=>{if(!v)return '-';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);const ps=new Intl.DateTimeFormat('ar-SA',{timeZone:tz,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).formatToParts(d);const g=k=>ps.find(x=>x.type===k)?.value||'';return `${g('day')}/${g('month')}/${g('year')} — ${g('hour')}:${g('minute')} ${g('dayPeriod')}`};
const purposeName=v=>({SALE:'للبيع',RENT:'للإيجار',SALE_RENT:'للبيع والإيجار',STORAGE:'توقيف / تخزين'}[v]||v||'-');
const moneyText=(v,c)=>{const n=Number(v||0);const sym={SAR:'ر.س',YER:'ر.ي',USD:'$',AED:'د.إ',KWD:'د.ك',QAR:'ر.ق'}[c]||c||'';return n.toLocaleString('ar-SA')+' '+sym};
const id=new URLSearchParams(location.search).get('id');
let receipt=null,cachedBlob=null,cachedFile=null,preparing=null,fileName='document.pdf';
function render(r){receipt=r;const isEntry=r.type==='ASSET_ENTRY',d=r.data||r.asset||{},recipient=isEntry?r.recipientName:r.payerName,phone=isEntry?r.recipientPhone:r.payerPhone,title=isEntry?'سند استلام أصل / معدة':'سند استلام مبلغ';fileName=`Houshak-${isEntry?'Asset-Receipt':'Payment-Receipt'}-${String(r.number).replace(/[^A-Za-z0-9_-]/g,'-')}.pdf`;document.title=`${title} ${r.number}`;const amount=!isEntry?moneyText(r.amount,r.currency):'';document.getElementById('content').innerHTML=`<div class="sheet" id="receiptSheet"><div class="brand">${d.systemLogo?`<img src="${esc(d.systemLogo)}" alt="الشعار">`:''}<h2>${esc(d.documentTitle||d.systemName||'حوشك')}</h2>${d.documentSubtitle?`<div class="doc-subtitle">${esc(d.documentSubtitle)}</div>`:''}<p>${esc(d.systemAddress||'')} ${d.systemPhone?`— ${esc(d.systemPhone)}`:''}</p></div><div class="doc-head"><div class="doc-title">${title}</div><div class="doc-no">رقم السند: ${esc(r.number)}</div></div><div class="box"><div class="row"><b>تاريخ إصدار السند</b><span>${esc(formatDateTime(r.createdAt,d.timezone||'Asia/Riyadh'))}</span></div><div class="row"><b>${isEntry?'اسم صاحب الأصل':'اسم العميل / الدافع'}</b><span>${esc(recipient)}</span></div><div class="row"><b>رقم الهاتف</b><span>${esc(phone)}</span></div>${isEntry?`<div class="row"><b>نوع الهوية</b><span>${esc(identityTypeName(d.owner?.identityType))}</span></div><div class="row"><b>رقم الهوية</b><span>${esc(d.owner?.identityNumber||'-')}</span></div>`:''}</div><div class="box"><h3>بيانات الأصل</h3><div class="row"><b>اسم الأصل</b><span>${esc(d.assetTitle||'-')}</span></div><div class="row"><b>كود الأصل</b><span>${esc(d.assetCode||'-')}</span></div>${!isEntry?`<div class="row"><b>اسم مالك الأصل</b><span>${esc(d.owner?.name||'-')}</span></div>`:''}<div class="row"><b>الشركة / النوع</b><span>${esc(d.manufacturer||'-')}</span></div><div class="row"><b>الموديل</b><span>${esc(d.model||'-')}</span></div>${isEntry?`<div class="row"><b>اللون</b><span>${esc(d.color||'-')}</span></div><div class="row"><b>رقم اللوحة</b><span>${esc(d.plateNumber||'-')}</span></div><div class="row"><b>تاريخ ووقت دخول الأصل</b><span>${esc(formatDateTime(d.entryAt,d.timezone||'Asia/Riyadh'))}</span></div><div class="row"><b>الغرض</b><span>${esc(purposeName(d.purpose))}</span></div>${d.salePrice?`<div class="row"><b>سعر العرض للبيع</b><span>${moneyText(d.salePrice,d.currency)}</span></div>`:''}${d.rentPrice?`<div class="row"><b>سعر الإيجار</b><span>${moneyText(d.rentPrice,d.currency)} / ${esc(d.rentUnit||'يوم')}</span></div>`:''}${d.dailyStorageFee?`<div class="row"><b>رسوم التوقيف اليومية</b><span>${moneyText(d.dailyStorageFee,d.currency)}</span></div>`:''}`:`<div class="row"><b>نوع العملية</b><span>${esc({DEPOSIT:'عربون حجز',PAYMENT:'دفعة',RENT:'إيجار',OTHER:'أخرى'}[r.paymentType]||r.paymentType)}</span></div><div class="row"><b>المبلغ</b><span>${amount}</span></div><div class="row"><b>البيان</b><span>${esc(r.description||'-')}</span></div>`}</div>${d.publicToken?`<div class="box" style="text-align:center"><h3>باركود الأصل</h3><div id="receiptQr" style="display:flex;justify-content:center;margin:10px 0"></div><small class="muted">يمسح العميل الباركود لمعرفة تفاصيل الأصل والتواصل مع إدارة الحوش فقط.</small></div>`:''}<div class="footer"><div><b>أنشأ السند:</b> ${esc(r.user?.name||d.createdBy?.name||'غير محدد')}<br><span>تاريخ الإصدار: ${esc(formatDateTime(r.createdAt,d.timezone||'Asia/Riyadh'))}</span></div><div class="stamp">سند صادر من ${esc(d.documentTitle||d.systemName||'حوشك')}<br>${esc(d.documentFooter||'مستند إلكتروني')}</div></div></div>`;if(d.publicToken&&window.QRCode){new QRCode(document.getElementById('receiptQr'),{text:location.origin+'/asset/'+encodeURIComponent(d.publicToken),width:130,height:130,correctLevel:QRCode.CorrectLevel.M});}document.getElementById('shareBtn').disabled=false;document.getElementById('waBtn').disabled=false;}
async function load(){try{if(!id)throw Error('رقم السند غير موجود');const res=await fetch('/api/admin/receipts/'+encodeURIComponent(id),{credentials:'same-origin'});const r=await res.json();if(!res.ok)throw Error(r.error||'تعذر تحميل السند');render(r);preparePdf().catch(e=>console.error(e));}catch(e){document.getElementById('content').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function makePdf(){if(!window.html2canvas||!window.jspdf)throw Error('تعذر تحميل أدوات إنشاء PDF. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.');const sheet=document.getElementById('receiptSheet');const canvas=await html2canvas(sheet,{scale:2,useCORS:true,backgroundColor:'#fff'});const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const pageW=210,pageH=297,margin=8,maxW=pageW-margin*2,maxH=pageH-margin*2;const ratio=Math.min(maxW/(canvas.width/2),maxH/(canvas.height/2));const w=(canvas.width/2)*ratio,h=(canvas.height/2)*ratio;pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',(pageW-w)/2,margin,w,h);return pdf.output('blob')}
async function preparePdf(){if(cachedFile)return cachedFile;if(preparing)return preparing;preparing=makePdf().then(blob=>{cachedBlob=blob;cachedFile=new File([blob],fileName,{type:'application/pdf'});return cachedFile}).finally(()=>{preparing=null});return preparing}
async function downloadPdf(){try{const blob=cachedBlob||await makePdf();cachedBlob=blob;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){alert(e.message)}}
async function sharePdf(){try{const file=await preparePdf();if(!window.isSecureContext)throw Error('مشاركة الملفات تحتاج HTTPS.');if(!navigator.share)throw Error('المتصفح لا يدعم مشاركة الملفات.');if(navigator.canShare&&navigator.canShare({files:[file]})===false)console.warn('canShare رفض الملف؛ نجرب share مباشرة');await navigator.share({files:[file]});}catch(e){if(e?.name==='AbortError')return;alert(e?.message||'تعذر مشاركة ملف PDF. يمكنك تنزيله ثم مشاركته يدويًا.');}}
async function shareWhatsApp(){try{const file=await preparePdf();if(!window.isSecureContext)throw Error('مشاركة ملف PDF تحتاج إلى HTTPS.');if(!navigator.share)throw Error('المتصفح لا يدعم مشاركة الملفات من هذه الصفحة.');if(navigator.canShare&&navigator.canShare({files:[file]})===false)console.warn('canShare رفض الملف؛ نجرب share مباشرة');await navigator.share({files:[file]});}catch(e){if(e?.name==='AbortError')return;alert(e?.message||'تعذر فتح نافذة مشاركة PDF.');}}
document.getElementById('shareBtn').onclick=sharePdf;document.getElementById('waBtn').onclick=shareWhatsApp;document.getElementById('downloadBtn').onclick=downloadPdf;load();
</script></body></html>
